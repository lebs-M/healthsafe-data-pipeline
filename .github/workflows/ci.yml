name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: healthsafe
          POSTGRES_PASSWORD: healthsafe
          POSTGRES_DB: healthsafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthsafe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://healthsafe:healthsafe@localhost:5432/healthsafe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit + integration tests
        run: pytest -v
      - name: Run the pipeline end to end
        run: python -m healthsafe_pipeline
